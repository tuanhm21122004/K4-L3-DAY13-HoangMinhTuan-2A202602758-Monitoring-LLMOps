alerts:
  - name: high_latency_p95
    severity: warning
    condition: "latency_p95 > 3000ms"
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1-high-latency-p95
  - name: high_error_rate
    severity: critical
    condition: "error_rate_pct > 2.0%"
    duration: 2m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2-high-error-rate
  - name: retrieval_degradation
    severity: critical
    condition: "retrieval_success_rate_pct < 90.0% or quality_score_avg < 0.75"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-3-retrieval-degradation
